server {
    listen 80;
    server_name _;

    # JS and CSS must never be cached by Cloudflare or the browser.
    # Without this, Cloudflare serves stale JS for up to 4 hours after a deploy.
    location ~* \.(js|css)$ {
        proxy_pass http://localhost:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Pragma "no-cache";
    }

    # MCP streamable HTTP (F44 P1) — exact match. Without it, the `location /mcp/` prefix
    # below makes nginx answer `/mcp` with a 301 to `/mcp/` (proxy_pass auto-redirect),
    # which breaks MCP POSTs. Stateless JSON responses; Authorization header passes through.
    location = /mcp {
        proxy_pass http://localhost:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    # MCP SSE endpoint (deprecated, JWT-gated; removed in F44 P4) — disable buffering so events reach the client immediately
    location /mcp/ {
        proxy_pass http://localhost:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
    }

    location / {
        proxy_pass http://localhost:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }
}
