app:
  name: "rita"

server:
  host: "0.0.0.0"
  port: 8000

data:
  raw_dir: "data/raw"        # Source CSVs as downloaded — read-only
  input_dir: "data/input"    # Processed/merged CSVs ready for model
  output_dir: "data/output"  # Backtest results, risk timeline, trade events

model:
  path: "models"             # Trained model ZIPs; instrument subfolder added at runtime

chat:
  # Local path to the sentence-transformers/all-MiniLM-L6-v2 snapshot.
  # Override with RITA_CHAT__EMBED_MODEL_PATH env var for your platform.
  embed_model_path: ""

# Financial constants — config-driven, never hardcoded in application code.
# Per-instrument training/data configs live in config/instruments/<name>.yaml.
instruments:
  nifty:
    lot_size: 75        # changed from 50 in 2024
  banknifty:
    lot_size: 30

# F42 FnO Trade Analysis — scope + Console import limits (keys must match TradeAnalysisSettings).
trade_analysis:
  underlyings: ["NIFTY", "BANKNIFTY"]
  expiry_months: [9, 10, 11]
  expiry_year: 2026            # month filter applies to this year only
  date_from: 2026-07-01        # read/analysis window start; import keeps everything
  import_max_file_bytes: 10485760
  import_max_files: 10
  import_max_total_bytes: 26214400
  import_allowed_extensions: [".csv", ".xlsx"]
  import_max_rows: 200000
  import_max_uncompressed_bytes: 104857600
  import_max_zip_ratio: 100
  symbol_aliases: {}
  # F42 Phase 3 analytics thresholds
  analytics_recon_tolerance_inr: 1.0
  expiry_settlement: spot_intrinsic   # spot_intrinsic | off  (expiry-held lots closed at spot intrinsic = ESTIMATE)
  turn_threshold_pct: 1.0
  adverse_spot_pct: 0.5
  burst_window_minutes: 30
  burst_min_fills: 3
  reentry_window_minutes: 30
  low_cash_threshold_inr: 50000.0
  debit_streak_min_days: 3
  loser_mark_max_stale_days: 5
  stop_loss_multiples: [1.0, 1.5, 2.0]
  suggestion_percentile: 75
  suggestion_min_closed_trades: 10
  cooling_off_min_minutes: 15
  cooling_off_max_minutes: 120
  analytics_min_timestamp_coverage: 0.8
  analytics_max_rows: 200
  observation_high_churn_pct: 50.0
  holding_bucket_edges_minutes: [5, 30, 120]   # same-day holding buckets (minutes)
  spot_stale_days: 5
  spot_pad_days: 7
  ledger_sign_tolerance_frac: 0.001
  ledger_sign_min_tolerance_inr: 1.0
  ledger_sign_match_cutoff: 0.6
  stop_multiple_step: 0.25
