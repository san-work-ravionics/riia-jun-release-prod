<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>
// Login gate (F44: Jarvis requires login). Same gate as ds.html / ops.html:
// production without a valid auth_token → Google sign-in, back here via post_login_redirect.
// Localhost: js/jarvis/main.js calls ensureDevToken() first.
(function(){
  if (['localhost', '127.0.0.1', '0.0.0.0'].includes(location.hostname)) return;
  var t = sessionStorage.getItem('auth_token');
  var expired = false;
  if (t) { try { var p = JSON.parse(atob(t.split('.')[1])); expired = p.exp && (Date.now()/1000 > p.exp); } catch(e){} }
  if (!t || expired) {
    sessionStorage.removeItem('auth_token');
    sessionStorage.setItem('post_login_redirect', window.location.href);
    window.location.href = '/auth/google/login';
  }
})();
</script>
<title>RIIA — Jarvis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Mono:wght@300;400;500&family=Epilogue:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@3.0.1/dist/chartjs-plugin-annotation.min.js"></script>
<style>
/* ── RITA look-and-feel: tokens, shell, sidebar, cards, KPIs, tables, chat — as rita.html ── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
[hidden]{display:none!important}
:root{
  --bg:#F5F3EE;--surface:#FFFFFF;--surface2:#F9F8F5;--border:#E4E0D8;--border2:#D0CBBC;
  --text:#1A1814;--t1:#1A1814;--t2:#4A4640;--t3:#8C877A;--t4:#B8B2A6;
  --build:#1A6B3C;--build-bg:#EDF7F2;--build-bd:#B6DEC9;
  --run:#0056B8;--run-bg:#EDF4FF;--run-bd:#AECBF5;
  --mon:#6B2FA0;--mon-bg:#F5EFFE;--mon-bd:#CFADF0;
  --warn:#92480A;--warn-bg:#FEF4EB;--warn-bd:#F5C99A;
  --danger:#9B1C1C;--danger-bg:#FEF2F2;--danger-bd:#FCA5A5;
  --chat:#BE185D;--chat-bg:#FFF0F5;--chat-bd:#FBCFE8;
  --fd:'Epilogue',sans-serif;--fm:'IBM Plex Mono',monospace;--fs:'Instrument Serif',serif;
  --r:6px;--sh:0 1px 3px rgba(0,0,0,.07),0 1px 2px rgba(0,0,0,.04);
  --shm:0 4px 12px rgba(0,0,0,.08),0 2px 4px rgba(0,0,0,.05);
}
body{background:var(--bg);color:var(--text);font-family:var(--fd);font-size:13px;line-height:1.5;min-height:100vh;}
.shell{display:grid;grid-template-columns:224px 1fr;grid-template-rows:52px 1fr;min-height:100vh;transition:grid-template-columns .22s cubic-bezier(.4,0,.2,1);}
.shell.nav-collapsed{grid-template-columns:0px 1fr;}
.shell.nav-collapsed .sidebar{overflow:hidden;border-right:none;}

/* Topbar */
.topbar{grid-column:1/-1;background:var(--surface);border-bottom:1.5px solid var(--border);display:flex;align-items:center;padding:0 20px;position:sticky;top:0;z-index:200;box-shadow:var(--sh);}
.logo{display:flex;align-items:center;gap:9px;min-width:206px;text-decoration:none;color:inherit;}
.logo-icon{width:26px;height:26px;background:var(--text);border-radius:5px;display:flex;align-items:center;justify-content:center;}
.logo-icon svg{fill:var(--surface);}
.logo-name{font-family:var(--fs);font-size:16px;letter-spacing:-.01em;}
.logo-ver{font-family:var(--fm);font-size:10px;color:var(--t3);margin-left:2px;}
.topbar-mid{flex:1;padding:0 24px;}
.topbar-right{display:flex;align-items:center;gap:10px;}
.home-link{font-family:var(--fm);font-size:11px;color:var(--t3);text-decoration:none;display:flex;align-items:center;gap:4px;padding:4px 10px;border:1px solid var(--border);border-radius:var(--r);}
.home-link:hover{background:var(--surface2);color:var(--text);}
.status-pill{display:flex;align-items:center;gap:6px;font-family:var(--fm);font-size:11px;color:var(--t2);background:var(--surface2);border:1px solid var(--border);border-radius:100px;padding:3px 10px;white-space:nowrap;}
.status-dot{width:7px;height:7px;border-radius:50%;background:#ccc;flex-shrink:0;}
.status-dot.ok{background:var(--build);animation:blink 2s infinite;}
.status-dot.warn{background:var(--warn);}
.status-dot.err{background:var(--danger);}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.4}}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:5px;font-family:var(--fd);font-size:12px;font-weight:600;padding:6px 13px;border-radius:var(--r);border:1.5px solid transparent;cursor:pointer;transition:opacity .12s,background .12s;white-space:nowrap;text-decoration:none;}
.btn-primary{background:var(--text);color:var(--surface);border-color:var(--text);}
.btn-primary:hover{opacity:.85;}
.btn-ghost{background:transparent;color:var(--t2);border-color:var(--border);}
.btn-ghost:hover{background:var(--surface2);}
.btn-sm{padding:4px 10px;font-size:11px;}
.btn:disabled{opacity:.4;cursor:not-allowed;}

/* Sidebar — location + view are nav items (buttons; main.js toggles .is-active) */
.sidebar{background:var(--surface);border-right:1.5px solid var(--border);padding:14px 0;overflow-y:auto;display:flex;flex-direction:column;}
.nav-section{margin-bottom:4px;}
.nav-label{font-family:var(--fm);font-size:9px;font-weight:500;text-transform:uppercase;letter-spacing:.1em;color:var(--t4);padding:8px 16px 4px;}
.nav-item{display:flex;align-items:center;gap:8px;width:100%;padding:7px 16px;cursor:pointer;font-family:var(--fd);font-size:12px;color:var(--t2);background:transparent;border:0;border-left:2px solid transparent;text-align:left;transition:background .1s,color .1s;user-select:none;}
.nav-item:hover{background:var(--surface2);color:var(--text);}
.nav-item.is-active{color:var(--text);font-weight:600;}
.nav-item.is-active.p00{border-left-color:var(--text);background:var(--surface2);}
.nav-item.is-active.p03{border-left-color:var(--run);background:var(--run-bg);}
.nav-item.is-active.p05{border-left-color:var(--chat);background:var(--chat-bg);}
.nav-icon{width:14px;text-align:center;flex-shrink:0;font-size:12px;}
.sidebar-footer{margin-top:auto;padding:12px 16px;border-top:1px solid var(--border);}
.sidebar-footer .lbl{font-family:var(--fm);font-size:10px;color:var(--t4);}

/* Main */
.main{overflow-y:auto;padding:24px 28px;min-width:0;}
.page-hdr{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:20px;}
.page-title{font-family:var(--fs);font-size:22px;letter-spacing:-.01em;}
.page-sub{color:var(--t3);font-size:12px;margin-top:2px;max-width:760px;}

/* KPI rows / cards */
.kpi-row-3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px;}
.kpi-row-4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px;}
.kpi{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--r);padding:14px 16px;box-shadow:var(--sh);}
.kpi-label{font-family:var(--fm);font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--t3);margin-bottom:4px;}
.kpi-value{font-family:var(--fm);font-size:22px;font-weight:500;letter-spacing:-.02em;line-height:1.1;}
.kpi-value.pos{color:var(--build);} .kpi-value.neg{color:var(--danger);}
.kpi-sm{padding:9px 12px;}
.kpi-sm .kpi-value{font-size:16px;}
.kpi-delta{font-size:11px;color:var(--t3);margin-top:3px;}
.card{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--r);padding:18px;box-shadow:var(--sh);margin-bottom:16px;}
.card-hdr{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;}
.card-title{font-size:13px;font-weight:600;color:var(--text);}
.card-sub{font-size:11px;color:var(--t3);}
.card-row-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-bottom:16px;}
.card-row-2>.card,.card-row-2>.chart-wrap{margin-bottom:0;}

/* Charts */
.chart-wrap{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--r);padding:18px;box-shadow:var(--sh);margin-bottom:16px;}
.card .chart-wrap{box-shadow:none;border-width:1px;padding:14px;margin-bottom:0;}
.chart-title{font-size:12px;font-weight:600;margin-bottom:14px;color:var(--t2);}
canvas{display:block;}
.chart-box{position:relative;height:220px;width:100%;}
.chart-box-sm{position:relative;height:180px;width:100%;}

/* Tables (rita.html th/td) */
.tbl-wrap{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--r);overflow-x:auto;box-shadow:var(--sh);}
.jv-table{width:100%;border-collapse:collapse;}
.jv-table th{background:var(--surface2);font-family:var(--fm);font-size:10px;font-weight:500;text-transform:uppercase;letter-spacing:.06em;color:var(--t3);padding:9px 14px;text-align:left;border-bottom:1px solid var(--border);white-space:nowrap;}
.jv-table th.num{text-align:right;}
.jv-table td{padding:8px 14px;border-bottom:1px solid var(--border);font-size:12px;color:var(--t2);vertical-align:top;}
.jv-table tr:last-child td{border-bottom:none;}
.jv-table tbody tr:hover td{background:var(--surface2);}
.jv-table-sm th,.jv-table-sm td{padding:6px 10px;}
.mpanel .jv-table th,.mpanel .jv-table td{padding:7px 10px;}
#jv-grid-body tr{cursor:pointer;}
#jv-grid-body tr.is-selected td{background:var(--run-bg);}
#jv-grid-body tr.is-selected td:first-child{box-shadow:inset 3px 0 0 var(--run);color:var(--run);font-weight:600;}
.mono{font-family:var(--fm);}
.num{text-align:right;font-family:var(--fm);white-space:nowrap;}
.ok{color:var(--build);} .warn{color:var(--warn);} .pos{color:var(--build);} .neg{color:var(--danger);}
.jv-table td.pos{color:var(--build);} .jv-table td.neg{color:var(--danger);}

/* Text helpers */
.jv-h3{font-family:var(--fm);font-size:10px;font-weight:500;text-transform:uppercase;letter-spacing:.06em;color:var(--t3);margin:18px 0 8px;}
#jv-plan-goal .jv-h3:first-child{margin-top:0;}
.jv-muted{color:var(--t3);font-size:11px;}
.jv-note{color:var(--t2);font-size:12px;margin:4px 0 8px;line-height:1.6;}
.jv-note.ok{color:var(--build);} .jv-note.warn{color:var(--warn);}
.jv-method{color:var(--t3);font-size:11px;margin-top:12px;line-height:1.6;padding-top:10px;border-top:1px solid var(--border);}
.jv-badge{display:inline-flex;align-items:center;font-family:var(--fm);font-size:9px;font-weight:500;text-transform:uppercase;letter-spacing:.04em;padding:1px 6px;border-radius:3px;border:1px solid var(--warn-bd);background:var(--warn-bg);color:var(--warn);}
.jv-list{list-style:none;font-size:12px;color:var(--t2);}
.jv-list li{padding:3px 0;border-bottom:1px dashed var(--border);}
.jv-list li:last-child{border-bottom:none;}

/* Panels (Market Analysis layout) */
.jv-chat-grid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,4fr);gap:14px;height:calc(100vh - 52px - 120px);min-height:520px;}
.mpanel{display:flex;flex-direction:column;background:var(--surface);border:1.5px solid var(--border);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden;min-height:0;}
.mpanel-hdr{padding:10px 14px;border-bottom:1px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:space-between;gap:12px;}
.mpanel-title{font-size:12px;font-weight:700;color:var(--text);}
.mpanel-sub{font-size:10px;color:var(--t3);margin-top:1px;}
.mpanel-body{flex:1;overflow-y:auto;padding:14px;min-height:0;}
.mpanel-footer{flex-shrink:0;padding:10px 14px;border-top:1px solid var(--border);}

/* Chat bubbles (rita.html .cmsg / .cbubble) */
#jv-chat-log{display:flex;flex-direction:column;gap:10px;}
.jv-msg{display:flex;flex-direction:column;max-width:88%;gap:4px;}
.jv-msg-user{align-self:flex-end;align-items:flex-end;}
.jv-msg-assistant{align-self:flex-start;align-items:flex-start;}
.jv-bubble{padding:9px 13px;border-radius:10px;font-size:12px;line-height:1.65;white-space:pre-wrap;}
.jv-msg-user .jv-bubble{background:var(--chat);color:#fff;border-bottom-right-radius:2px;}
.jv-msg-assistant .jv-bubble{background:var(--surface2);border:1px solid var(--border);border-bottom-left-radius:2px;color:var(--text);}
.jv-dots{display:inline-flex;gap:4px;align-items:center;height:12px;}
.jv-dots i{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--t4);animation:tdot-bounce .8s infinite;}
.jv-dots i:nth-child(2){animation-delay:.15s}.jv-dots i:nth-child(3){animation-delay:.3s}
@keyframes tdot-bounce{0%,80%,100%{transform:translateY(0)}40%{transform:translateY(-4px)}}
/* Reply cards */
.jv-card{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--r);padding:10px 12px;min-width:280px;box-shadow:var(--sh);}
.jv-card-title{font-size:11px;font-weight:700;color:var(--text);margin-bottom:6px;}
.jv-card-sub{font-size:11px;color:var(--t3);margin:4px 0;}
.jv-card-sub.ok{color:var(--build);}
.jv-kpis{display:flex;flex-wrap:wrap;gap:6px;}
.jv-kpi{background:var(--surface2);border:1px solid var(--border);border-radius:var(--r);padding:6px 10px;}
.jv-kpi-label{font-family:var(--fm);font-size:9px;text-transform:uppercase;letter-spacing:.05em;color:var(--t3);}
.jv-kpi-value{font-family:var(--fm);font-size:13px;font-weight:500;}
/* Chips (rita.html .chat-chip, inline) */
#jv-chat-chips{display:flex;flex-wrap:wrap;gap:6px;}
#jv-chat-chips:not(:empty){margin-bottom:10px;}
.jv-chip{background:var(--surface2);border:1px solid var(--border);border-radius:100px;padding:5px 12px;font-size:11px;font-family:var(--fd);color:var(--t2);cursor:pointer;line-height:1.4;transition:background .12s,border-color .12s,color .12s;}
.jv-chip:hover{background:var(--chat-bg);border-color:var(--chat-bd);color:var(--chat);}
/* Chat input (rita.html .chat-input / .chat-send) */
#jv-chat-form{display:flex;gap:8px;align-items:center;}
#jv-chat-input{flex:1;border:1.5px solid var(--border);border-radius:var(--r);padding:8px 10px;font-family:var(--fd);font-size:12px;background:var(--surface2);color:var(--text);outline:none;transition:border-color .12s;}
#jv-chat-input:focus{border-color:var(--chat);}
#jv-chat-send{width:32px;height:32px;border-radius:var(--r);border:none;background:var(--chat);color:#fff;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:opacity .12s;}
#jv-chat-send:hover{opacity:.88;}
#jv-chat-send:disabled{background:var(--t4);cursor:not-allowed;}
#jv-chat-error{margin-top:8px;font-size:12px;color:var(--danger);background:var(--danger-bg);border:1px solid var(--danger-bd);border-radius:var(--r);padding:6px 10px;}

/* Plan */
.jv-dl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;}
.jv-dl-row{display:flex;flex-direction:column;background:var(--surface2);border:1px solid var(--border);border-radius:var(--r);padding:8px 12px;}
.jv-dl-row span{font-family:var(--fm);font-size:9px;text-transform:uppercase;letter-spacing:.06em;color:var(--t3);margin-bottom:2px;}
.jv-dl-row b{font-family:var(--fm);font-weight:500;font-size:15px;letter-spacing:-.01em;}
#jv-plan-empty{color:var(--t3);font-size:12px;text-align:center;padding:40px 12px;}
#jv-plan-empty .jv-note{text-align:left;}

/* Portfolio */
#jv-pf-source{font-size:12px;color:var(--t2);background:var(--surface);border:1.5px solid var(--border);border-left:3px solid var(--run);border-radius:var(--r);padding:9px 14px;margin-bottom:16px;box-shadow:var(--sh);}
#jv-target-required{font-size:12px;font-weight:600;color:var(--run);margin-bottom:10px;}
#jv-pnl-empty{background:var(--surface);border:1.5px dashed var(--border2);border-radius:var(--r);padding:28px 16px;text-align:center;color:var(--t3);margin:0;}
.jv-pnl-col{display:flex;flex-direction:column;}
.jv-pnl-col>.chart-wrap{flex:1;margin-bottom:0;}
.jv-pnl-col>#jv-pnl-empty{flex:1;display:flex;align-items:center;justify-content:center;}

/* Portfolio P4c — locations side by side (rita.html pb-* region buckets) */
.jv-sec-hdr{margin-bottom:12px;}
.jv-sec-hdr .card-sub{margin-top:2px;}
#jv-pf-status{margin-top:6px;}
.jv-loc-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:16px;align-items:start;}
.jv-loc-col{background:var(--surface);border:1.5px solid var(--border);border-top:3px solid var(--border2);border-radius:var(--r);padding:14px;box-shadow:var(--sh);display:flex;flex-direction:column;gap:10px;min-width:0;cursor:pointer;transition:border-color .15s,background .15s,box-shadow .15s;}
.jv-loc-col:hover{border-top-color:var(--border2);background:var(--surface2);}
.jv-loc-col.is-active{border-top-color:var(--run);border-color:var(--run-bd);background:var(--run-bg);box-shadow:var(--shm);}
.jv-loc-col.is-filtered{border-top-color:var(--build);border-color:var(--build-bd);background:var(--build-bg);}
.jv-loc-name{font-family:var(--fd);font-size:13px;font-weight:700;color:var(--text);}
.jv-loc-ccy{font-family:var(--fm);font-size:10px;color:var(--t3);background:var(--surface2);border:1px solid var(--border);border-radius:3px;padding:1px 6px;vertical-align:middle;}
.jv-loc-meta{font-size:11px;color:var(--t3);}
.jv-loc-avg{font-family:var(--fm);font-size:12px;}
.jv-loc-avg b.pos{color:var(--build);} .jv-loc-avg b.neg{color:var(--danger);}
.jv-loc-pf{background:var(--surface2);border:1px solid var(--border);border-radius:var(--r);padding:10px;font-size:12px;color:var(--t2);}
.jv-loc-pf:empty{display:none;}
.jv-loc-pf-title{font-size:12px;font-weight:600;color:var(--text);margin-bottom:8px;}
.jv-loc-kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin-bottom:8px;}
.jv-loc-kpis .kpi{box-shadow:none;padding:6px 8px;}
.jv-loc-kpis .kpi-value{font-size:13px;}
.jv-hold-chips{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px;}
.jv-hold-chip{font-family:var(--fm);font-size:10px;background:var(--run-bg);border:1px solid var(--run-bd);color:var(--t2);border-radius:100px;padding:2px 8px;}
.jv-hold-chip b{color:var(--run);font-weight:600;}
.jv-loc-cash{font-size:11px;}
.jv-loc-inst{max-height:420px;overflow-y:auto;}
.jv-loc-row{display:flex;align-items:center;gap:8px;padding:6px 6px;border-radius:var(--r);border:1px solid transparent;font-size:12px;}
.jv-loc-row.is-mine{background:var(--run-bg);border-color:var(--run-bd);}
.jv-loc-row-id{flex:1;min-width:0;display:flex;flex-wrap:wrap;align-items:center;gap:4px;}
.jv-loc-row-id .mono{font-weight:600;color:var(--text);}
.jv-sector{font-size:10px;padding:0 6px;border-radius:100px;background:var(--surface2);border:1px solid var(--border);color:var(--t3);}
.jv-badge-held,.jv-badge-both{border-color:var(--build-bd);background:var(--build-bg);color:var(--build);}
.jv-badge-selected{border-color:var(--run-bd);background:var(--run-bg);color:var(--run);}
.jv-minibar{display:inline-block;height:5px;border-radius:2px;background:var(--t4);flex-shrink:0;}
.jv-minibar.pos{background:var(--build);} .jv-minibar.neg{background:var(--danger);}
.jv-loc-details{align-self:flex-start;}
.jv-loc-col.is-active .jv-loc-details{color:var(--run);border-color:var(--run-bd);background:var(--run-bg);}
.jv-divider{display:flex;align-items:center;gap:12px;margin:22px 0 14px;font-family:var(--fm);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--t3);}
.jv-divider::before,.jv-divider::after{content:"";flex:1;height:1px;background:var(--border2);}
/* Region breadcrumb — shown when a sidebar location button is clicked in Portfolio view */
.jv-region-breadcrumb{display:flex;align-items:center;gap:8px;margin-bottom:14px;font-size:12px;color:var(--t3);}
.jv-region-breadcrumb button{background:none;border:none;padding:0;font-family:var(--fd);font-size:12px;color:var(--run);cursor:pointer;}
.jv-region-breadcrumb button:hover{text-decoration:underline;}
.jv-region-breadcrumb .sep{color:var(--t4);}
/* Overview cards — clean summary: hide instrument tiles, chips, cash, verbose section header */
#sec-jv-locations .jv-sec-hdr{display:none;}
#sec-jv-locations .jv-loc-inst{display:none;}
#sec-jv-locations .jv-loc-pf-title{display:none;}
#sec-jv-locations .jv-hold-chips{display:none;}
#sec-jv-locations .jv-loc-cash{display:none;}
#sec-jv-locations .jv-loc-pf .jv-muted{display:none;}
.jv-geo-scroll{max-height:400px;overflow-y:auto;box-shadow:none;}
.jv-sort{background:none;border:0;padding:0;font:inherit;color:inherit;text-transform:inherit;letter-spacing:inherit;cursor:pointer;}
.jv-sort:hover{color:var(--text);}
.jv-risk{display:inline-flex;gap:2px;vertical-align:middle;}
.jv-risk i{width:6px;height:6px;border-radius:50%;background:var(--border);}
.jv-risk i.on{background:var(--warn);}
.jv-empty-box{background:var(--surface);border:1.5px dashed var(--border2);border-radius:var(--r);padding:28px 16px;text-align:center;color:var(--t3);margin:0;flex:1;display:flex;align-items:center;justify-content:center;}
.jv-empty-box[hidden]{display:none;}

/* Instrument — engine toggle as the Overview Daily/Weekly/Monthly tabs */
#jv-inst-engines{display:flex;align-items:center;gap:4px;border-bottom:1.5px solid var(--border);margin-bottom:16px;}
.jv-seg{background:transparent;border:none;border-bottom:2px solid transparent;padding:8px 16px;font-family:var(--fd);font-size:12px;font-weight:600;color:var(--t3);cursor:pointer;margin-bottom:-1.5px;transition:color .12s,border-color .12s;}
.jv-seg:hover{color:var(--text);}
.jv-seg.is-active{color:var(--build);border-bottom-color:var(--build);}
.jv-seg.is-dim{color:var(--t4);}
.jv-seg.is-dim.is-active{color:var(--t3);border-bottom-color:var(--t3);}
#jv-inst-status{font-size:12px;color:var(--warn);background:var(--warn-bg);border:1px solid var(--warn-bd);border-radius:var(--r);padding:9px 14px;margin-bottom:14px;}
#jv-inst-levels,#jv-rationale{background:var(--surface2);border:1px solid var(--border);border-radius:var(--r);padding:12px 14px;}
#jv-inst-levels .jv-table td{background:transparent;}
/* rationale — .reasoning-data-row layout as fno/hedge-reasoning.js (re-implemented) */
.reasoning-data-row{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0;}
.reasoning-kpi{font-family:var(--fm);font-size:10px;color:var(--t3);background:var(--surface);border:1px solid var(--border);border-radius:4px;padding:2px 8px;}
.reasoning-kpi strong{color:var(--text);font-weight:600;}

/* Concepts (rita.html Concepts + Agents & Linked Analytics) */
.step-bar{display:flex;gap:0;margin-bottom:16px;border:1.5px solid var(--border);border-radius:var(--r);overflow:hidden;background:var(--surface);}
.step-seg{flex:1;padding:6px 4px;text-align:center;font-family:var(--fm);font-size:9px;color:var(--t4);border-right:1px solid var(--border);transition:background .2s;}
.step-seg:last-child{border-right:none;}
.step-seg.done{background:var(--build-bg);color:var(--build);}
.step-seg.active{background:var(--run-bg);color:var(--run);font-weight:600;}
.concept-text{font-size:13px;color:var(--t2);line-height:1.8;}
.concept-text p+p{margin-top:12px;}
.concept-tab-bar{display:flex;flex-wrap:wrap;width:100%;background:var(--surface);border:1.5px solid var(--border);border-radius:var(--r);overflow:hidden;margin-bottom:22px;}
.concept-tab{flex:1;min-width:120px;text-align:center;font-family:var(--fd);font-size:12px;font-weight:500;padding:9px 6px;border:none;border-right:1px solid var(--border);cursor:pointer;background:transparent;color:var(--t2);transition:background .12s,color .12s;white-space:nowrap;}
.concept-tab:last-child{border-right:none;}
.concept-tab:hover{background:var(--surface2);color:var(--text);}
.concept-tab.active{background:var(--run-bg);color:var(--run);font-weight:700;}
.concept-desc{font-size:12.5px;color:var(--t2);line-height:1.78;margin-bottom:16px;}
.concept-chart-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;}
.chart-col-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--t3);margin-bottom:6px;}
.kpi-row-2{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
.cx-empty{height:240px;display:flex;align-items:center;justify-content:center;text-align:center;padding:0 24px;color:var(--t4);font-size:12px;border:1px dashed var(--border);border-radius:var(--r);background:var(--surface2);}
.cx-states{display:flex;flex-wrap:wrap;align-items:center;gap:6px;min-height:120px;align-content:center;}
.cx-state{font-family:var(--fm);font-size:10px;text-transform:uppercase;letter-spacing:.04em;padding:5px 9px;border-radius:3px;background:var(--surface2);border:1px solid var(--border);color:var(--t3);}
.cx-state.is-current{background:var(--run-bg);border-color:var(--run-bd);color:var(--run);font-weight:600;}
.cx-arrow{color:var(--t4);font-size:11px;}

/* Scrollbar */
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}

@media (max-width:1400px){
  .jv-loc-grid{grid-template-columns:repeat(2,minmax(0,1fr));}
}
@media (max-width:1100px){
  .jv-chat-grid{grid-template-columns:1fr;height:auto;min-height:0;}
  .jv-chat-grid .mpanel{min-height:420px;}
  #sec-jv-chat{height:560px;}
  .kpi-row-4{grid-template-columns:repeat(2,1fr);}
  .card-row-2{grid-template-columns:1fr;}
  .concept-chart-grid{grid-template-columns:1fr;}
  .jv-loc-grid{grid-template-columns:1fr;}
}
</style>

<script>
(function(){
  var KEY='rita_nav_collapsed';
  var btn=document.getElementById('nav-toggle');
  var shell=document.querySelector('.shell');
  var sidebar=document.querySelector('.sidebar');
  if(!btn||!shell||!sidebar)return;
  if(window.innerWidth>768&&localStorage.getItem(KEY)==='1')shell.classList.add('nav-collapsed');
  btn.addEventListener('click',function(){
    if(window.innerWidth>768){
      var c=shell.classList.toggle('nav-collapsed');
      localStorage.setItem(KEY,c?'1':'0');
    } else {
      sidebar.classList.toggle('open');
      document.body.classList.toggle('nav-open');
    }
  });
  document.addEventListener('click',function(e){
    if(document.body.classList.contains('nav-open')&&!sidebar.contains(e.target)&&e.target!==btn){
      sidebar.classList.remove('open');document.body.classList.remove('nav-open');
    }
  });
})();
</script>

  background:rgba(0,0,0,0.72);
  align-items:center;justify-content:center;cursor:zoom-out;">
  <div onclick="event.stopPropagation()" style="
    background:var(--surface);border-radius:var(--r);
    padding:24px;width:94vw;max-width:94vw;max-height:96vh;
    box-shadow:0 8px 40px rgba(0,0,0,0.4);position:relative;overflow:auto;">
    <button onclick="closeChartModal()" style="
      position:absolute;top:10px;right:14px;
      background:none;border:none;font-size:22px;
      cursor:pointer;color:var(--t2);line-height:1;">✕</button>
    <div id="chart-modal-title" style="font-family:var(--fs);font-size:16px;font-weight:600;margin-bottom:16px;padding-right:28px;color:var(--t1)"></div>
    <img id="chart-modal-img" style="width:100%;max-height:88vh;display:block;border-radius:4px;object-fit:contain;" />
  </div>
</div>
<script type="module" src="./js/jarvis/main.js?v=3"></script>
<script>fetch('/health').then(r=>r.json()).then(d=>{document.querySelectorAll('.app-ver').forEach(e=>e.textContent='v'+d.version)}).catch(()=>{})</script>
</body>
</html>
