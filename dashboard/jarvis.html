<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>
// Login gate (F44: Jarvis requires login). Same gate as ds.html / ops.html:
// production without a valid auth_token → Google sign-in, back here via post_login_redirect.
// Localhost: js/jarvis/main.js calls ensureDevToken() first.
(function(){
  if (['localhost', '127.0.0.1', '0.0.0.0'].includes(location.hostname)) return;
  var t = sessionStorage.getItem('auth_token');
  var expired = false;
  if (t) { try { var p = JSON.parse(atob(t.split('.')[1])); expired = p.exp && (Date.now()/1000 > p.exp); } catch(e){} }
  if (!t || expired) {
    sessionStorage.removeItem('auth_token');
    sessionStorage.setItem('post_login_redirect', window.location.href);
    window.location.href = '/auth/google/login';
  }
})();
</script>
<title>RIIA — Jarvis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Mono:wght@300;400;500&family=Epilogue:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
:root{
  --bg:#F5F3EE;--surface:#FFFFFF;--surface2:#F9F8F5;--border:#E4E0D8;--border2:#D0CBBC;
  --text:#1A1814;--t1:#1A1814;--t2:#4A4640;--t3:#8C877A;--t4:#B8B2A6;
  --build:#1A6B3C;--build-bg:#EDF7F2;--build-bd:#B6DEC9;
  --run:#0056B8;--run-bg:#EDF4FF;--run-bd:#AECBF5;
  --mon:#6B2FA0;--warn:#92480A;--warn-bg:#FEF4EB;--warn-bd:#F5C99A;
  --danger:#9B1C1C;--danger-bg:#FEF2F2;
  --fd:'Epilogue',sans-serif;--fm:'IBM Plex Mono',monospace;--fs:'Instrument Serif',serif;
  --r:6px;--sh:0 1px 3px rgba(0,0,0,.07),0 1px 2px rgba(0,0,0,.04);
}
body{background:var(--bg);color:var(--text);font-family:var(--fd);font-size:13px;line-height:1.5;min-height:100vh;display:flex;flex-direction:column;}
.topbar{background:var(--surface);border-bottom:1.5px solid var(--border);display:flex;align-items:center;gap:20px;padding:0 24px;height:52px;box-shadow:var(--sh);position:sticky;top:0;z-index:200;}
.logo{display:flex;align-items:center;gap:9px;text-decoration:none;color:inherit;font-weight:700;}
.logo-icon{width:26px;height:26px;background:var(--text);border-radius:5px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;}
.home-link{font-size:12px;color:var(--t2);text-decoration:none;}
.home-link:hover{color:var(--run);}
.topbar-mid{flex:1;display:flex;align-items:center;gap:14px;}
.seg{display:inline-flex;border:1.5px solid var(--border);border-radius:var(--r);overflow:hidden;background:var(--surface2);}
.seg button,.jv-seg{font-family:var(--fd);font-size:12px;font-weight:600;padding:5px 12px;border:0;background:transparent;color:var(--t2);cursor:pointer;}
.seg button+button{border-left:1.5px solid var(--border);}
.seg button.is-active{background:var(--text);color:var(--surface);}
.status-pill{display:flex;align-items:center;gap:6px;font-family:var(--fm);font-size:11px;color:var(--t2);background:var(--surface2);border:1px solid var(--border);border-radius:100px;padding:3px 10px;white-space:nowrap;}
.status-dot{width:7px;height:7px;border-radius:50%;background:#ccc;flex-shrink:0;}
.status-dot.ok{background:var(--build);}
.status-dot.warn{background:var(--warn);}
.status-dot.err{background:var(--danger);}
main{flex:1;max-width:1240px;width:100%;margin:0 auto;padding:28px 20px 48px;}
h1{font-family:var(--fs);font-weight:400;font-size:36px;letter-spacing:-.01em;line-height:1.15;margin-bottom:6px;}
.lead{font-size:14px;color:var(--t2);max-width:720px;margin-bottom:22px;}
.jv-grid2{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:20px;align-items:start;}
.card{background:var(--surface);border:1.5px solid var(--border);border-radius:10px;padding:20px;box-shadow:var(--sh);margin-bottom:20px;}
.card h2{font-size:14px;font-weight:600;margin-bottom:12px;}
.jv-h3{font-size:12px;font-weight:600;color:var(--t2);text-transform:uppercase;letter-spacing:.05em;font-family:var(--fm);margin:14px 0 8px;}
.jv-h3:first-child{margin-top:0;}
.btn{display:inline-flex;align-items:center;gap:5px;font-family:var(--fd);font-size:12px;font-weight:600;padding:6px 13px;border-radius:var(--r);border:1.5px solid transparent;cursor:pointer;white-space:nowrap;text-decoration:none;}
.btn-primary{background:var(--text);color:var(--surface);border-color:var(--text);}
.btn-ghost{background:transparent;color:var(--t2);border-color:var(--border);}
.btn-sm{padding:4px 10px;font-size:11px;}
.btn:disabled{opacity:.4;cursor:not-allowed;}
.mono{font-family:var(--fm);}
.num{text-align:right;font-family:var(--fm);white-space:nowrap;}
.ok{color:var(--build);} .warn{color:var(--warn);} .pos{color:var(--build);} .neg{color:var(--danger);}
.jv-muted{color:var(--t3);font-size:11px;}
.jv-note{color:var(--t2);font-size:12px;margin:4px 0 8px;}
.jv-method{color:var(--t3);font-size:11px;margin-top:10px;}
.jv-badge{font-family:var(--fm);font-size:9px;text-transform:uppercase;padding:1px 5px;border-radius:3px;border:1px solid var(--warn-bd);background:var(--warn-bg);color:var(--warn);}
.jv-list{list-style:none;font-size:12px;color:var(--t2);}
.jv-list li{padding:2px 0;}
/* chat */
#jv-chat-log{height:460px;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:4px 4px 12px;}
.jv-msg{display:flex;flex-direction:column;max-width:86%;}
.jv-msg-user{align-self:flex-end;align-items:flex-end;}
.jv-msg-assistant{align-self:flex-start;}
.jv-bubble{padding:9px 12px;border-radius:10px;font-size:13px;white-space:pre-wrap;}
.jv-msg-user .jv-bubble{background:var(--text);color:var(--surface);border-bottom-right-radius:3px;}
.jv-msg-assistant .jv-bubble{background:var(--surface2);border:1px solid var(--border);border-bottom-left-radius:3px;}
.jv-dots{display:inline-flex;gap:4px;}
.jv-dots i{width:6px;height:6px;border-radius:50%;background:var(--t3);animation:jvb 1.2s infinite;}
.jv-dots i:nth-child(2){animation-delay:.2s}.jv-dots i:nth-child(3){animation-delay:.4s}
@keyframes jvb{0%,100%{opacity:.25}50%{opacity:1}}
.jv-card{margin-top:6px;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:10px 12px;min-width:260px;}
.jv-card-title{font-size:12px;font-weight:600;margin-bottom:4px;}
.jv-card-sub{font-size:11px;color:var(--t2);margin:4px 0;}
.jv-kpis{display:flex;flex-wrap:wrap;gap:8px;}
.jv-kpi{background:var(--surface2);border:1px solid var(--border);border-radius:5px;padding:5px 8px;}
.jv-kpi-label{font-family:var(--fm);font-size:9px;text-transform:uppercase;letter-spacing:.05em;color:var(--t3);}
.jv-kpi-value{font-family:var(--fm);font-size:13px;}
#jv-chat-chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0;}
.jv-chip{font-family:var(--fd);font-size:12px;padding:4px 11px;border-radius:100px;border:1.5px solid var(--run-bd);background:var(--run-bg);color:var(--run);cursor:pointer;}
.jv-chip:hover{border-color:var(--run);}
#jv-chat-form{display:flex;gap:8px;}
#jv-chat-input{flex:1;font-family:var(--fd);font-size:13px;padding:8px 11px;border:1.5px solid var(--border);border-radius:var(--r);background:var(--surface);}
#jv-chat-input:focus{outline:none;border-color:var(--run);}
#jv-chat-error{margin-top:8px;font-size:12px;color:var(--danger);}
/* plan */
.jv-dl{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;}
.jv-dl-row{display:flex;flex-direction:column;}
.jv-dl-row span{font-family:var(--fm);font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--t3);}
.jv-dl-row b{font-family:var(--fm);font-weight:500;font-size:14px;}
#jv-plan-empty{color:var(--t2);font-size:13px;}
/* tables */
.jv-table{width:100%;border-collapse:collapse;font-size:12px;}
.jv-table th{font-family:var(--fm);font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--t3);font-weight:500;text-align:left;padding:6px 8px;border-bottom:1.5px solid var(--border);}
.jv-table th.num{text-align:right;}
.jv-table td{padding:6px 8px;border-bottom:1px solid var(--border);vertical-align:top;}
.jv-table-sm td,.jv-table-sm th{padding:4px 6px;}
#jv-grid-body tr{cursor:pointer;}
#jv-grid-body tr:hover{background:var(--surface2);}
#jv-grid-body tr.is-selected{background:var(--run-bg);box-shadow:inset 3px 0 0 var(--run);}
/* kpis / charts (as rita.html) */
.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px;}
.kpi{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--r);padding:12px 14px;box-shadow:var(--sh);}
.kpi-sm{padding:8px 12px;}
.kpi-label{font-family:var(--fm);font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--t3);margin-bottom:4px;}
.kpi-value{font-family:var(--fm);font-size:18px;font-weight:500;letter-spacing:-.02em;line-height:1.1;}
.kpi-value.pos{color:var(--build);} .kpi-value.neg{color:var(--danger);}
.chart-wrap{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--r);padding:16px;box-shadow:var(--sh);margin-bottom:16px;}
.chart-title{font-size:12px;font-weight:600;margin-bottom:12px;color:var(--t2);}
.chart-box{position:relative;height:260px;}
.chart-box-sm{position:relative;height:200px;}
#jv-pf-source{font-size:13px;color:var(--t2);margin-bottom:12px;}
#jv-target-required{font-size:12px;font-weight:600;margin-bottom:10px;}
#jv-inst-engines{display:inline-flex;border:1.5px solid var(--border);border-radius:var(--r);overflow:hidden;background:var(--surface2);margin-bottom:12px;}
.jv-seg+.jv-seg{border-left:1.5px solid var(--border);}
.jv-seg.is-active{background:var(--text);color:var(--surface);}
.jv-seg.is-dim{color:var(--t4);}
.jv-seg.is-dim.is-active{color:var(--surface);background:var(--t3);}
#jv-inst-status{font-size:12px;color:var(--warn);background:var(--warn-bg);border:1px solid var(--warn-bd);border-radius:var(--r);padding:8px 10px;margin-bottom:12px;}
/* rationale — .reasoning-data-row layout as fno/hedge-reasoning.js (re-implemented) */
.reasoning-data-row{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0;}
.reasoning-kpi{font-family:var(--fm);font-size:10px;color:var(--t3);background:var(--surface);border:1px solid var(--border);border-radius:4px;padding:2px 8px;}
.reasoning-kpi strong{color:var(--text);font-weight:600;}
@media (max-width:900px){
  .jv-grid2{grid-template-columns:1fr;}
  .topbar{flex-wrap:wrap;height:auto;padding:8px 16px;}
  main{padding:20px 16px 40px;}
}
</style>
</head>
<body>
<header class="topbar">
  <a class="logo" href="index.html"><span class="logo-icon">R</span>RIIA</a>
  <div class="topbar-mid">
    <div class="seg" id="jv-loc-tabs">
      <button type="button" data-loc="europe" data-copy="loc.europe"></button>
      <button type="button" data-loc="india" data-copy="loc.india"></button>
      <button type="button" data-loc="us" data-copy="loc.us"></button>
    </div>
    <div class="seg">
      <button type="button" id="jv-tab-chat" data-copy="tab.chat"></button>
      <button type="button" id="jv-tab-portfolio" data-copy="tab.portfolio"></button>
    </div>
  </div>
  <div class="status-pill" id="jv-status-model"><span class="status-dot warn"></span><span class="status-text">…</span></div>
  <a class="home-link" href="index.html">← Home</a>
</header>
<main>
  <h1 data-copy="page.h1"></h1>
  <p class="lead" data-copy="page.lead"></p>

  <!-- ── Chat & plan ─────────────────────────────────────── -->
  <div class="jv-grid2">
    <section class="card" id="sec-jv-chat">
      <div id="jv-chat-log" aria-live="polite"></div>
      <div id="jv-chat-chips"></div>
      <form id="jv-chat-form" autocomplete="off">
        <input id="jv-chat-input" type="text" maxlength="500">
        <button class="btn btn-primary" id="jv-chat-send" type="submit"></button>
      </form>
      <div id="jv-chat-error" hidden></div>
    </section>

    <section class="card" id="sec-jv-plan">
      <div id="jv-plan-empty" hidden></div>
      <div id="jv-plan-goal" hidden></div>
      <div id="jv-plan-selection" hidden></div>
      <div id="jv-plan-method" hidden></div>
      <div id="jv-plan-excluded" hidden></div>
      <div id="jv-plan-tracking" hidden></div>
      <div id="jv-plan-proposal" hidden></div>
    </section>
  </div>

  <!-- ── Portfolio ───────────────────────────────────────── -->
  <section id="sec-jv-portfolio" hidden>
    <div id="jv-pf-source"></div>
    <div class="kpi-row" id="jv-pf-kpis"></div>

    <div class="chart-wrap" hidden>
      <div class="chart-title" data-copy="pnl.title"></div>
      <div class="chart-box"><canvas id="jv-pnl-chart"></canvas></div>
    </div>
    <p class="jv-note" id="jv-pnl-empty" hidden></p>

    <section class="card">
      <h2 data-copy="target.title"></h2>
      <div id="jv-target-required" hidden></div>
      <div class="kpi-row" id="jv-target-kpis"></div>
      <div class="chart-wrap" hidden>
        <div class="chart-title" data-copy="target.title"></div>
        <div class="chart-box"><canvas id="jv-target-chart"></canvas></div>
      </div>
    </section>

    <section class="card">
      <h2 data-copy="engine.col.engine"></h2>
      <div id="jv-engine-table"></div>
      <p class="jv-muted" id="jv-engine-note" hidden></p>
      <div class="chart-wrap" hidden>
        <div class="chart-title" data-copy="engine.col.return"></div>
        <div class="chart-box-sm"><canvas id="jv-engine-chart"></canvas></div>
      </div>
    </section>
    <section class="card">
      <h2 data-copy="grid.title"></h2>
      <p class="jv-muted" data-copy="grid.hint"></p>
      <table class="jv-table" id="jv-grid">
        <thead><tr>
          <th data-copy="grid.col.instrument"></th><th data-copy="grid.col.in"></th>
          <th class="num" data-copy="grid.col.weight"></th><th class="num" data-copy="grid.col.shares"></th>
          <th class="num" data-copy="grid.col.last_close"></th><th class="num" data-copy="grid.col.pnl"></th>
          <th class="num" data-copy="grid.col.return"></th><th data-copy="grid.col.model"></th>
          <th class="num" data-copy="grid.col.sl"></th>
        </tr></thead>
        <tbody id="jv-grid-body"></tbody>
      </table>
      <p class="jv-note" id="jv-grid-empty" hidden></p>
    </section>
  </section>

  <!-- ── Instrument (click-to-chart) ─────────────────────── -->
  <section class="card" id="sec-jv-instrument" hidden>
    <div id="jv-inst-engines"></div>
    <div id="jv-inst-status" hidden></div>
    <div class="kpi-row" id="jv-inst-perf" hidden></div>
    <div class="chart-wrap" hidden>
      <div class="chart-title" id="jv-inst-title"></div>
      <div class="chart-box"><canvas id="jv-inst-chart"></canvas></div>
    </div>
    <div class="chart-wrap" id="jv-sleeve-wrap" hidden>
      <div class="chart-title" data-copy="inst.sleeve.title"></div>
      <div class="chart-box-sm"><canvas id="jv-sleeve-chart"></canvas></div>
    </div>
    <div class="jv-grid2">
      <div id="jv-inst-levels" hidden></div>
      <div id="jv-rationale" hidden></div>
    </div>
  </section>

</main>

<!-- ── Chart expand modal (copied from rita.html; shared/charts.js opens it) ── -->
<div id="chart-modal" onclick="closeChartModal()" style="
  display:none;position:fixed;inset:0;z-index:9999;
  background:rgba(0,0,0,0.72);
  align-items:center;justify-content:center;cursor:zoom-out;">
  <div onclick="event.stopPropagation()" style="
    background:var(--surface);border-radius:var(--r);
    padding:24px;width:94vw;max-width:94vw;max-height:96vh;
    box-shadow:0 8px 40px rgba(0,0,0,0.4);position:relative;overflow:auto;">
    <button onclick="closeChartModal()" style="
      position:absolute;top:10px;right:14px;
      background:none;border:none;font-size:22px;
      cursor:pointer;color:var(--t2);line-height:1;">✕</button>
    <div id="chart-modal-title" style="font-family:var(--fs);font-size:16px;font-weight:600;margin-bottom:16px;padding-right:28px;color:var(--t1)"></div>
    <img id="chart-modal-img" style="width:100%;max-height:88vh;display:block;border-radius:4px;object-fit:contain;" />
  </div>
</div>
<script type="module" src="./js/jarvis/main.js?v=2"></script>
</body>
</html>
